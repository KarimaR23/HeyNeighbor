<!DOCTYPE html>
<!--suppress ALL -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Fragments :: head('Access denied')}"><title>Access denied</title></head>
<body>
<header class="topbar">
    <a class="brand" href="/" th:href="@{/}">
        <img src="/images/logo.png" th:src="@{/images/logo.png}" alt="HeyNeighbor logo" width="40" height="40">
        <span>HeyNeighbor</span>
    </a>
    <div class="who">
        <form action="/logout" th:action="@{/logout}" method="post">
            <button class="btn" type="submit">Sign out</button>
        </form>
    </div>
</header>
<main class="narrow">
    <section class="panel login-card">
        <h1>Access denied</h1>
        <p>Your role does not have permission to open this page.</p>
        <p><a class="submit link-button" href="/dashboard" th:href="@{/dashboard}">Back to my dashboard</a></p>
    </section>
</main>
</body>
</html>
