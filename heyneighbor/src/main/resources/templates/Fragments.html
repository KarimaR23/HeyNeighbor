<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | HeyNeighbor'">HeyNeighbor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header and role navigation for every signed-in page -->
<th:block th:fragment="header">
    <header class="topbar">
        <a class="brand" th:href="@{/dashboard}">
            <img src="/images/logo.png" th:src="@{/images/logo.png}" alt="HeyNeighbor logo" width="40" height="40">
            <span>HeyNeighbor</span>
        </a>
        <div class="who">
            <span class="who-name" th:text="${currentUser.displayName}">Name</span>
            <form th:action="@{/logout}" method="post">
                <button class="btn" type="submit">Sign out</button>
            </form>
        </div>
    </header>

    <!-- Left menu for this role, like the Figma screens. Options come from NavService (functional requirements). -->
    <aside class="side-nav" aria-label="Role navigation">
        <p class="side-nav-role" th:text="${currentUser.roleLabel}">Role</p>
        <a th:href="@{${homePath}}" th:classappend="${currentPath == homePath} ? 'on'">
            <span>🏠</span> <span>Home</span>
        </a>
        <th:block th:each="n : ${roleNav}">
            <a th:if="${n.enabled}" th:href="@{${n.href}}"
               th:classappend="${#strings.startsWith(currentPath, n.href)} ? 'on'">
                <span th:text="${n.icon}">•</span> <span th:text="${n.label}">Link</span>
            </a>
            <a th:unless="${n.enabled}" href="#" onclick="return false;">
                <span th:text="${n.icon}">•</span> <span th:text="${n.label}">Link</span>
            </a>
        </th:block>
    </aside>
</th:block>

</body>
</html>
