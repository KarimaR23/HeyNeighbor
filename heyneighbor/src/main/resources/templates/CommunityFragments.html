<!DOCTYPE html>
<!--suppress ALL -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Community User layout: same look as the public home page (index.html) and the Figma Community User screens.
  Other roles keep the shared header in Fragments.html.
-->
<body>

<!-- Top bar with search and icon buttons, then the category chips -->
<th:block th:fragment="top">
  <header class="topbar cu-topbar">
    <a class="brand" th:href="@{/community}">
      <img src="/images/logo.png" th:src="@{/images/logo.png}" alt="HeyNeighbor logo" width="40" height="40">
      <span>HeyNeighbor</span>
    </a>

    <form class="search" method="get" th:action="@{/community/listings}" role="search">
      <input type="search" name="q" maxlength="100" th:value="${q}"
             placeholder="Search free items and services near you" aria-label="Search listings">
      <select name="radius" aria-label="Distance">
        <option value="">Any distance</option>
        <option th:each="mi : ${radiusOptions}" th:value="${mi}" th:text="${mi + ' mi'}"
                th:selected="${selectedRadius != null and selectedRadius == mi}">5 mi</option>
      </select>
      <input type="hidden" name="category" th:if="${selectedCategory != null}" th:value="${selectedCategory}">
    </form>

    <nav class="cu-icons" aria-label="Quick actions">
      <a href="#" onclick="return false;" title="Post a listing" aria-label="Post a listing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
      <a th:href="@{/community}" title="Home" aria-label="Home" th:classappend="${active == 'home'} ? 'on'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
      <a href="#" onclick="return false;" title="Messages" aria-label="Messages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5l1.4-4A7.5 7.5 0 1 1 8.6 18.6z"/></svg></a>
    </nav>

    <div class="cu-me">
      <span class="cu-avatar" th:text="${#strings.substring(currentUser.displayName, 0, 1)}">T</span>
      <span class="cu-me-name" th:text="${currentUser.displayName}">Tom Nguyen</span>
      <form th:action="@{/logout}" method="post">
        <button class="btn" type="submit">Sign out</button>
      </form>
    </div>
  </header>

  <div class="categories">
    <a th:href="@{/community/listings}" th:classappend="${active == 'browse' and selectedCategory == null} ? 'on'">
      <span>✨</span><span>All</span></a>
    <a th:each="c : ${categories}" th:href="@{/community/listings(category=${c.category_id})}"
       th:classappend="${selectedCategory != null and selectedCategory == c.category_id} ? 'on'">
      <span th:text="${c.emoji}">🥕</span><span th:text="${c.name}">Food</span></a>
  </div>
</th:block>

<!-- Left menu from the Figma Community User screens; options come from the functional requirements (NavService) -->
<aside class="cu-side" th:fragment="side">
  <p class="cu-side-role">Community User</p>
  <nav aria-label="Community User menu">
    <a th:href="@{/community}" th:classappend="${active == 'home'} ? 'on'"><span>🏠</span> Home</a>
    <th:block th:each="n : ${roleNav}">
      <a th:if="${n.enabled}" th:href="@{${n.href}}" th:classappend="${active == 'browse' and n.href == '/community/listings'} ? 'on'">
        <span th:text="${n.icon}">🔎</span> <span th:text="${n.label}">Browse Listings</span></a>
      <a th:unless="${n.enabled}" href="#" onclick="return false;">
        <span th:text="${n.icon}">➕</span> <span th:text="${n.label}">Post a Listing</span></a>
    </th:block>
    <hr>
    <a href="#" onclick="return false;"><span>👤</span> My Profile</a>
    <a href="#" onclick="return false;"><span>🕘</span> Recently Viewed</a>
    <a href="#" onclick="return false;"><span>⚠️</span> Report a Problem</a>
  </nav>
</aside>

<!-- One listing card, same design as "Near you right now" on the public home page -->
<article class="card" th:fragment="card(item)">
  <div class="thumb" th:style="'background:' + ${item.color}">
    <span class="emoji" th:text="${item.emoji}">🥕</span>
    <span class="badge" th:classappend="${item.listing_type == 'trade'} ? 'trade'"
          th:text="${item.listing_type == 'trade'} ? 'Trade' : 'Free'">Free</span>
  </div>
  <div class="info">
    <h3 th:text="${item.title}">Listing title</h3>
    <p class="meta">
      <span th:text="${item.category_name}">Food</span> ·
      <span th:if="${item.distance_miles != null}" th:text="${#numbers.formatDecimal(item.distance_miles, 1, 1)} + ' mi'">1.2 mi</span>
      <span th:if="${item.distance_miles == null}" th:text="${item.city != null ? item.city : item.postal_code}">Atlanta</span>
    </p>
    <p class="cu-wants" th:if="${item.listing_type == 'trade' and item.trade_wanted != null}">
      Looking for: <span th:text="${item.trade_wanted}">a monitor</span></p>
    <p class="giver">Posted by <span th:text="${item.posted_by}">Neighbor</span></p>
  </div>
</article>

</body>
</html>
