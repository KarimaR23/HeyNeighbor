<!DOCTYPE html>
<!--suppress ALL -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Fragments :: head(${pageTitle})}"><title>Browse Listings</title></head>
<body class="cu">
<th:block th:replace="~{CommunityFragments :: top}"></th:block>

<div class="cu-shell">
  <aside th:replace="~{CommunityFragments :: side}"></aside>

  <main class="cu-main">
    <div class="cu-section-head cu-browse-head">
      <div>
        <h1 th:text="${selectedCategoryName != null} ? ${selectedCategoryName} : 'Browse your neighborhood'">Browse your neighborhood</h1>
        <p class="meta">
          <strong th:text="${#lists.size(rows)}">0</strong> listing(s)
          <span th:if="${q != ''}"> for “<span th:text="${q}">tomatoes</span>”</span>
          <span th:if="${selectedRadius != null}"> within <span th:text="${selectedRadius}">5</span> mi</span>
        </p>
      </div>

      <form class="cu-filters" method="get" th:action="@{/community/listings}">
        <input type="hidden" name="q" th:if="${q != ''}" th:value="${q}">
        <select name="category" aria-label="Category">
          <option value="">All categories</option>
          <option th:each="c : ${categories}" th:value="${c.category_id}" th:text="${c.name}"
                  th:selected="${selectedCategory != null and selectedCategory == c.category_id}">Category</option>
        </select>
        <select name="radius" aria-label="Distance">
          <option value="">Any distance</option>
          <option th:each="mi : ${radiusOptions}" th:value="${mi}" th:text="${mi + ' miles'}"
                  th:selected="${selectedRadius != null and selectedRadius == mi}">5 miles</option>
        </select>
        <button class="cu-apply" type="submit">Apply</button>
        <a class="cu-clear" th:href="@{/community/listings}"
           th:if="${q != '' or selectedCategory != null or selectedRadius != null}">Clear</a>
      </form>
    </div>

    <p class="cu-note" th:if="${locationMissing}">
      Add your location to your profile to search by distance. Showing nothing for this distance until then.</p>

    <div class="grid" th:if="${!#lists.isEmpty(rows)}">
      <th:block th:each="item : ${rows}"><article th:replace="~{CommunityFragments :: card(${item})}"></article></th:block>
    </div>
    <p class="cu-empty" th:if="${#lists.isEmpty(rows)}">No listings match your search. Try another category or distance.</p>
  </main>
</div>

<footer><p>Hey Neighbor.</p></footer>
</body>
</html>
