<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{Fragments :: head(${pageTitle})}">
    <title>Community Support Requests</title>
</head>

<body>

<th:block th:replace="~{Fragments :: header}"></th:block>

<main class="wide">

    <div style="margin-bottom:24px;">

        <h1 style="margin-bottom:6px;">
            🤝 Community Support Requests
        </h1>

        <p style="color:#666;">
            Helping neighbors solve exchange and community issues.
        </p>

    </div>

    <div style="
        display:flex;
        gap:15px;
        margin-bottom:25px;
        flex-wrap:wrap;
    ">

        <a th:href="@{/support/requests}"
           style="
           background:#3b82f6;
           color:white;
           text-decoration:none;
           padding:12px 20px;
           border-radius:12px;
           font-weight:bold;">
            📬 Open Requests
        </a>

        <a th:href="@{/support/in-progress}"
           style="
           background:#f59e0b;
           color:white;
           text-decoration:none;
           padding:12px 20px;
           border-radius:12px;
           font-weight:bold;">
            🛠️ In Progress
        </a>

        <a th:href="@{/support/resolved}"
           style="
           background:#22c55e;
           color:white;
           text-decoration:none;
           padding:12px 20px;
           border-radius:12px;
           font-weight:bold;">
            ✅ Resolved
        </a>

    </div>

    <form method="get"
          style="
          background:#f8fafc;
          padding:18px;
          border-radius:12px;
          margin-bottom:24px;
          border:1px solid #e5e7eb;">

        <input type="text"
               name="search"
               th:value="${search}"
               placeholder="Search requests..."
               style="
               width:320px;
               padding:10px;
               border-radius:8px;
               border:1px solid #d1d5db;">

        <button type="submit"
                style="
                background:#2563eb;
                color:white;
                border:none;
                padding:10px 18px;
                border-radius:8px;
                cursor:pointer;">
            🔍 Search
        </button>

    </form>

    <p style="margin-bottom:20px;">
        <strong th:text="${#lists.size(rows)}">0</strong>
        request(s) found
    </p>

    <div th:if="${!#lists.isEmpty(rows)}">

        <div th:each="r : ${rows}"

             style="
             background:white;
             margin-bottom:24px;
             padding:24px;
             border-radius:18px;
             box-shadow:0 6px 18px rgba(0,0,0,.08);
             border-left:8px solid #3b82f6;">

            <div style="margin-bottom:15px;">

                <h3 style="margin:0;"
                    th:text="${r.subject}">
                    Request Subject
                </h3>

            </div>

            <div style="
                 display:flex;
                 gap:10px;
                 flex-wrap:wrap;
                 margin-bottom:15px;">

                <span style="
                      background:#dbeafe;
                      padding:6px 12px;
                      border-radius:999px;"
                      th:text="'🏷️ ' + ${r.request_type}">
                </span>

                <span style="
                      background:#fef3c7;
                      padding:6px 12px;
                      border-radius:999px;"
                      th:text="'🔥 ' + ${r.priority}">
                </span>

                <span style="
                      background:#dcfce7;
                      padding:6px 12px;
                      border-radius:999px;"
                      th:text="'📌 ' + ${r.status}">
                </span>

            </div>

            <p style="color:#666;">
                Request #
                <span th:text="${r.support_request_id}"></span>
            </p>

            <form th:action="@{/support/update-status}"
                  method="post">

                <input type="hidden"
                       name="supportRequestId"
                       th:value="${r.support_request_id}" />

                <label>
                    <strong>💬 Coordinator Response</strong>
                </label>

                <textarea
                        name="resolutionSummary"
                        rows="4"
                        placeholder="Enter your response or resolution..."
                        style="
                        width:100%;
                        margin-top:8px;
                        margin-bottom:15px;
                        padding:12px;
                        border-radius:10px;
                        border:1px solid #d1d5db;
                        resize:vertical;"></textarea>

                <div style="
                     display:flex;
                     gap:10px;
                     flex-wrap:wrap;
                     align-items:center;">

                    <select
                            name="status"
                            style="
                            padding:10px;
                            border-radius:8px;
                            border:1px solid #d1d5db;">

                        <option value="open">📬 Open</option>

                        <option value="in_progress">
                            🛠️ In Progress
                        </option>

                        <option value="resolved">
                            ✅ Resolved
                        </option>

                    </select>

                    <button type="submit"
                            style="
                            background:#2563eb;
                            color:white;
                            border:none;
                            padding:12px 20px;
                            border-radius:10px;
                            font-weight:bold;
                            cursor:pointer;">
                        🚀 Update Request
                    </button>

                </div>

            </form>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(rows)}"
         style="
         text-align:center;
         padding:40px;
         border-radius:12px;
         background:#f8fafc;">

        <h3>🎉 Nothing to review right now!</h3>

        <p>No support requests found.</p>

    </div>

</main>

</body>
</html>
