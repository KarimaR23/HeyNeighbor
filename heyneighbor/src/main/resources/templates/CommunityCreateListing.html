
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{Fragments :: head(${pageTitle})}">
    <title>Create Listing</title>
</head>

<body class="cu">
<th:block th:replace="~{CommunityFragments :: top}"></th:block>

<div class="cu-shell">

    <aside th:replace="~{CommunityFragments :: side}"></aside>

    <main class="cu-main">

        <div class="cu-section-head">
            <div>
                <h1>Post a Listing</h1>
                <p class="meta">
                    Share an item or service with your community.
                </p>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger"
             th:text="${error}">
        </div>

        <form method="post"
              th:action="@{/community/listings/new}"
              enctype="multipart/form-data">

            <div>
                <label for="title">Listing Title</label>
                <input type="text" id="title" name="title"
                       maxlength="150" required>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          rows="5" required></textarea>
            </div>

            <div>
                <label for="categoryId">Category</label>
                <select id="categoryId" name="categoryId" required>
                    <option value="">Select a category</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.category_id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <div>
                <label for="listingType">Listing Type</label>
                <select id="listingType" name="listingType" required>
                    <option value="gift">Gift (Free)</option>
                    <option value="trade">Trade</option>
                </select>
            </div>

            <div>
                <label for="offeringKind">What are you offering?</label>
                <select id="offeringKind" name="offeringKind" required>
                    <option value="good">Item</option>
                    <option value="service">Service</option>
                </select>
            </div>

            <div>
                <label for="tradeWanted">What would you like in return?</label>
                <input type="text" id="tradeWanted"
                       name="tradeWanted"
                       placeholder="Only required for trades">
            </div>

            <div>
                <label for="fulfillmentMethodId">
                    Fulfillment Method
                </label>
                <select id="fulfillmentMethodId"
                        name="fulfillmentMethodId" required>
                    <option value="">Select a method</option>
                    <option th:each="method : ${fulfillmentMethods}"
                            th:value="${method.method_id}"
                            th:text="${method.method_name}">
                    </option>
                </select>
            </div>

            <div>
                <label for="quantityAvailable">Quantity Available</label>
                <input type="number" id="quantityAvailable"
                       name="quantityAvailable" min="1">
            </div>


            <div>
                <label for="pickupDropoffNotes">
                    Pickup / Drop-off Details
                </label>
                <textarea id="pickupDropoffNotes"
                          name="pickupDropoffNotes"
                          rows="3"></textarea>
            </div>

            <div>
                <label for="listingImage">Listing Picture (Optional)</label>

                <input type="file"
                       id="listingImage"
                       name="listingImage"
                       accept="image/jpeg,image/png,image/webp">

                <small>JPG, PNG, or WebP. Maximum 5 MB.</small>
            </div>

            <button type="submit" class="cu-apply">
                Publish Listing
            </button>

            <a th:href="@{/community/listings}"
               class="cu-clear">Cancel</a>

        </form>

    </main>
</div>

<footer><p>Hey Neighbor.</p></footer>

</body>
</html>
